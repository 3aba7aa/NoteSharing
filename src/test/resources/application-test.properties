# Test profile: PostgreSQL supplied by Testcontainers via @DynamicPropertySource.
# Entities are validated against the Flyway baseline, never created by Hibernate.
# Hibernate's EntityManagerFactory validates at startup, which races Flyway. The
# ordering is fixed in FlywayTestConfig (@DependsOn("flywayInitializer")) rather than
# by a property, because defer-datasource-initialization only covers script-based
# initialization and does not cover Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Test-only secret. Never used outside tests.
app.jwt.secret=test-only-secret-value-at-least-32-bytes-long-0123456789
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D
app.jwt.issuer=notesharing
