# Shared defaults. Secrets are NOT set here: each profile supplies its own so that
# production can demand JWT_SECRET from the environment rather than inheriting a default.
spring.application.name=NoteSharing

# Fail fast rather than silently issuing N+1 queries and holding sessions open.
spring.jpa.open-in-view=false

spring.jackson.default-property-inclusion=non_null

# JWT. Durations are ISO-8601. The secret is per-profile: see application-dev/prod.properties.
app.jwt.secret=dev-only-secret-not-used-anywhere-real-0123456789
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D
app.jwt.issuer=notesharing

# Where the browser frontend runs. Comma-separated; overridden per environment.
app.cors.allowed-origins=http://localhost:5173
