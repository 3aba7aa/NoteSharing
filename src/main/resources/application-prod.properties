# Production. Every setting comes from the environment; nothing here has a usable default,
# so a misconfigured deployment fails to start rather than booting insecurely.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000

# validate, never create-drop: Hibernate checks that the schema matches the entities and
# refuses to start on a mismatch. Schema changes ship as Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# No default. A missing JWT_SECRET must stop the deployment.
app.jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ORIGINS}

spring.jpa.show-sql=false
