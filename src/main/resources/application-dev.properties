# Local development. In-memory H2 so a fresh clone runs with no external database.
# Flyway is off here: Hibernate creates the schema from the entities. The PostgreSQL
# profiles validate against db/migration instead, so a mapping that only works on
# create-drop is caught there, not here.
spring.datasource.url=jdbc:h2:mem:notesharing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Development-only secret. Fine to commit: it signs nothing but local test data.
app.jwt.secret=dev-only-secret-not-used-anywhere-real-0123456789
